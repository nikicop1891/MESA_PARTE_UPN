<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Partes Digital</title>
    <!-- Conexión a Bootstrap 5 para el diseño moderno -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    
    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🏛️ Mesa de Partes UPN</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Registrar Trámite</a>
                <a class="nav-link" href="/buscar">Buscar</a>
                <a class="nav-link" href="/listar">Ver Expedientes</a>
            </div>
        </div>
    </nav>
    
    <!-- Contenedor dinámico (Aquí carga el contenido de las otras páginas) -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Pie de página con el aviso normativo -->
    <footer class="container mt-5 text-muted text-center small pb-4">
        <hr>
        <p><strong>Aviso Legal (D.S. N.° 075-2023-PCM):</strong> Los documentos ingresados después de las 18:00 hrs o en días no hábiles se consideran recibidos el día hábil siguiente.</p>
    </footer>

    <!-- Scripts de Bootstrap (Opcional, para animaciones o menús desplegables en móviles) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
